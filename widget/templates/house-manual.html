<style>
.gs-out{display:grid;justify-items:center;gap:.7em;text-align:center;padding:calc(var(--hw-space) * .5) 0}
.gs-out .hw-ico{width:2em;height:2em;color:var(--hw-accent)}

<section class="hw [[card]]">
  {#sample_data}<div class="hw-sample">Sample data</div>{/sample_data}
