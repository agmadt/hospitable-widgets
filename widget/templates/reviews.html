<style>
.rv-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:.5em 1em;margin-bottom:1em}
.rv-head h2{margin:0}
.rv-avg{font-weight:600}
.rv-avg span{color:var(--hw-accent);letter-spacing:.08em}
.rv{margin:0;padding:calc(var(--hw-space) * 1.2);border-radius:calc(var(--hw-radius) * .75);box-shadow:inset 0 0 0 1px var(--hw-line);display:flex;flex-direction:column;gap:.65em}
.rv-stars{color:var(--hw-accent);letter-spacing:.1em;font-size:.95em}
.rv blockquote{margin:0;display:-webkit-box;-webkit-line-clamp:7;-webkit-box-orient:vertical;overflow:hidden}
.rv footer{display:flex;align-items:center;gap:.6em;margin-top:auto}
.rv-av{width:2.3em;height:2.3em;border-radius:50%;display:grid;place-items:center;background:var(--hw-soft);color:var(--hw-accent);font-weight:700}
.rv-who{line-height:1.25}
.rv-who b{display:block}
.rv-resp{font-size:.9em;padding:.7em .9em;border-radius:calc(var(--hw-radius) * .5);background:var(--hw-soft)}
.rv-resp b{display:block;font-size:.85em;margin-bottom:.2em}
.cards .rv-track{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:calc(var(--hw-space) * .9)}
.list .rv-track{display:grid;gap:calc(var(--hw-space) * .9)}
.carousel .rv-track{display:grid;grid-template-columns:repeat(var(--hosp-per-view,1),1fr);gap:calc(var(--hw-space) * .9)}
.nav{display:flex;align-items:center;justify-content:center;gap:1em;margin-top:1em}
.nav button{all:unset;cursor:pointer;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 0 0 1.5px var(--hw-line)}
.nav button:disabled{opacity:.35;cursor:default}
.rv-empty{color:var(--hw-muted)}
</style>
<section class="hw [[card]] [[layout]]">
  {#sample_data}<div class="hw-sample">Sample data</div>{/sample_data}
  <div class="rv-head"><h2>[[heading]]</h2>{#review_count}<div class="rv-avg"><span aria-hidden="true">★</span> {rating_average_formatted} · {review_count_label}</div>{/review_count}</div>
  <div [[#layout=carousel]]data-hosp-pager data-hosp-per-view="auto" data-hosp-min-width="300" tabindex="0"[[/layout=carousel]]>
    <div class="rv-track">
      {#reviews}<figure class="rv" data-hosp-page>
        <div class="rv-stars" aria-label="{rating} out of 5 stars">{stars}</div>
        <blockquote>{text}</blockquote>
        [[#show_response]]{#host_response}<div class="rv-resp"><b>Response from the host</b>{host_response}</div>{/host_response}[[/show_response]]
        <footer><div class="rv-av" aria-hidden="true">{guest_initial}</div><div class="rv-who"><b>{guest_name}</b><span class="hw-small hw-muted">{date_formatted}[[#show_platform]]{#platform_label} · {platform_label}{/platform_label}[[/show_platform]]</span></div></footer>
      </figure>{/reviews}
    </div>
    {^reviews}<p class="rv-empty">No reviews to show yet.</p>{/reviews}
    [[#layout=carousel]]<div class="nav"><button data-hosp-prev aria-label="Previous reviews"><svg class="hw-ico" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button><span class="hw-small hw-muted" data-hosp-page-label></span><button data-hosp-next aria-label="Next reviews"><svg class="hw-ico" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button></div>[[/layout=carousel]]
  </div>
</section>
